name: Deploy on Push

# mainへのpush（コード変更・データ変更どちらも）でVercelにデプロイする。
# 楽天APIへのアクセスはIPが固定されているローカル環境が担当する。
# このワークフローはVercelへのデプロイトリガーのみを行う。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'                        # フロントエンドのコード変更
      - 'data/portable-power/**'        # ポータブル電源データ更新
      - 'data/drum-washing-machine/**'  # ドラム式洗濯機データ更新
      - 'data/refrigerator/**'          # 大型冷蔵庫データ更新
      - 'public/**'                     # 静的アセット変更
      - 'next.config.js'                # Next.js設定変更
      - 'vercel.json'                   # Vercel設定変更

  # 手動実行（緊急デプロイ用）
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. チェックアウト ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. データファイルの確認 ──────────────────────────────
      - name: Verify data files
        run: |
          echo "=== 最新データファイル ==="
          ls -lh data/portable-power/processed/ | tail -3 || true
          ls -lh data/drum-washing-machine/processed/ | tail -3 || true
          python3 -c "
          import json, glob
          for slug in ['portable-power', 'drum-washing-machine', 'refrigerator']:
              files = sorted(glob.glob(f'data/{slug}/processed/*-processed.json'), reverse=True)
              if files:
                  d = json.load(open(files[0]))
                  print(f'[{slug}] 取得件数: {d[\"meta\"][\"totalItems\"]}件 / {d[\"meta\"][\"processedAt\"]}')
          "

      # ── 3. Node.js セットアップ ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Vercel CLI でデプロイ ──────────────────────────────
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest --silent
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN | tee deploy_url.txt
          echo "✅ デプロイ完了: $(cat deploy_url.txt | tail -1)"

      # ── 4. サマリー出力 ──────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 電源URL | https://my-only-fragrance-gos.vercel.app/portable-power |" >> $GITHUB_STEP_SUMMARY
          echo "| 洗濯機URL | https://my-only-fragrance-gos.vercel.app/drum-washing-machine |" >> $GITHUB_STEP_SUMMARY
          echo "| 冷蔵庫URL | https://my-only-fragrance-gos.vercel.app/refrigerator |" >> $GITHUB_STEP_SUMMARY
          echo "| 実行日時 | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
