name: Deploy on Data Push

# ローカルMacがデータをpushしたときだけ動くワークフロー。
# 楽天APIへのアクセスはIPが固定されているローカル環境が担当する。
# このワークフローはVercelへのデプロイトリガーのみを行う。

on:
  push:
    branches: [main]
    paths:
      - 'data/portable-power/**'        # データファイルが更新されたときのみ発火
      - 'data/drum-washing-machine/**'  # ドラム式洗濯機データ更新時も発火
      - 'data/refrigerator/**'          # 大型冷蔵庫データ更新時も発火

  # 手動実行（緊急デプロイ用）
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. チェックアウト ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. データファイルの確認 ──────────────────────────────
      - name: Verify data files
        run: |
          echo "=== 最新データファイル ==="
          ls -lh data/portable-power/processed/ | tail -3 || true
          ls -lh data/drum-washing-machine/processed/ | tail -3 || true
          python3 -c "
          import json, glob
          for slug in ['portable-power', 'drum-washing-machine', 'refrigerator']:
              files = sorted(glob.glob(f'data/{slug}/processed/*-processed.json'), reverse=True)
              if files:
                  d = json.load(open(files[0]))
                  print(f'[{slug}] 取得件数: {d[\"meta\"][\"totalItems\"]}件 / {d[\"meta\"][\"processedAt\"]}')
          "

      # ── 3. Vercelへデプロイ ──────────────────────────────────
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID:    ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"my-only-fragrance-gos\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repoId\": \"$(curl -s https://api.github.com/repos/sanukkey/my-only-fragrance-gos | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"id\"])')\",
                \"ref\": \"main\"
              },
              \"projectId\": \"${VERCEL_PROJECT_ID}\",
              \"target\": \"production\"
            }")
          echo "$RESULT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          url = d.get('url', '')
          state = d.get('readyState', d.get('status', ''))
          if url:
              print(f'✅ デプロイ開始: https://{url}')
          else:
              print('⚠️  レスポンス:', json.dumps(d, ensure_ascii=False)[:200])
          "

      # ── 4. サマリー出力 ──────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 電源URL | https://my-only-fragrance-gos.vercel.app/portable-power |" >> $GITHUB_STEP_SUMMARY
          echo "| 洗濯機URL | https://my-only-fragrance-gos.vercel.app/drum-washing-machine |" >> $GITHUB_STEP_SUMMARY
          echo "| 冷蔵庫URL | https://my-only-fragrance-gos.vercel.app/refrigerator |" >> $GITHUB_STEP_SUMMARY
          echo "| 実行日時 | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
